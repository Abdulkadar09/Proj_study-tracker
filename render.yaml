services:
  - type: web
    name: ProjStudyTimer
    env: node
    plan: starter
    repo: https://github.com/Abdulkadar09/Proj_study-tracker
    branch: main
    buildCommand: npm run install-all && npm run build
    startCommand: npm run start
    disks:
      - name: study-data
        mountPath: /data
        sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/study.db
      - key: ENABLE_DEBUG_ENDPOINTS
        value: "true"
      - key: VITE_API_BASE
        value: ""
