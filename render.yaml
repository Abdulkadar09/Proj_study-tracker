services:
  - type: web
    name: ProjStudyTimer
    env: node
    plan: starter
    repo: https://github.com/Abdulkadar09/Proj_study-tracker
    branch: main
    buildCommand: npm run install-all && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE
        value: ""